# Refreshes the slow-moving data: the kanji wall, and the reachable ceiling for
# each JLPT level.
#
# Separate from the snapshot workflow, and far less frequent. The kanji file is
# two orders of magnitude larger than the hourly archive and mastery moves
# slowly; the ceilings change only when decks are added or renshuu fixes its
# content. Collecting either hourly would cost ~40 extra API calls an hour to
# rewrite files that almost never differ.
name: Weekly collection

on:
  schedule:
    # Mondays at 04:00 UTC. The minute is deliberately not :50, so this doesn't
    # queue up behind a snapshot run and race it for the same branch.
    - cron: '0 4 * * 1'

  # Lets you refresh by hand after adding a schedule in renshuu — the wall only
  # covers kanji that are in a schedule, so a new one won't appear until this
  # runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanji
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must be 24 or newer: the scripts are run directly as TypeScript, and
          # Node only strips types without a flag from 23.6 onwards.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect kanji
        env:
          RENSHUU_API_KEY: ${{ secrets.RENSHUU_API_KEY }}
        run: npm run kanji

      # Which levels contain terms that can never be studied, so the dashboard
      # can treat a level as finished at its real ceiling rather than projecting
      # forever toward a 100% it cannot reach.
      - name: Collect level ceilings
        env:
          RENSHUU_API_KEY: ${{ secrets.RENSHUU_API_KEY }}
        run: npm run ceilings

      - name: Commit the updated collections
        id: commit
        run: |
          set -euo pipefail

          if git diff --quiet -- public/data/kanji.json public/data/ceilings.json; then
            echo "No change to the weekly collections."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/kanji.json public/data/ceilings.json
          git commit -m "Weekly collection $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Republish so the new data is actually visible. As with the snapshot
  # workflow, this has to be an explicit call: GitHub does not fire workflows
  # for pushes made with the built-in GITHUB_TOKEN.
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
