# Captures renshuu stats and commits them to the archive.
#
# This is the workflow that actually builds the permanent history — the thing
# renshuu's own UI doesn't keep. Everything else in this repo just visualises
# whatever this has collected.
#
# It runs several times a day and keeps one entry per study day, refreshing that
# entry as the day goes on. See the cron comment below for why once a day was
# not good enough.
name: Snapshot

on:
  schedule:
    # Every three hours, not once a day.
    #
    # renshuu resets its `today_*` counters at local midnight, so the useful
    # capture is the last one before that boundary. A single nightly run cannot
    # be relied on to be it: GitHub's scheduler is best-effort and routinely
    # runs late. This originally fired at 21:50 UTC — 23:50 in Berlin, only ten
    # minutes of headroom — and on 29 July 2026 it ran 51 minutes late, at 00:41
    # local. By then the counter had reset, so that day was never captured at
    # its full value and is understated in the archive permanently.
    #
    # Running repeatedly fixes this because a same-day run replaces the entry
    # rather than appending: each run refreshes the day with a fuller count, and
    # whichever run lands last before local midnight is the one that sticks. A
    # delayed run is no longer a lost day, just a slightly earlier cutoff.
    #
    # Cost is negligible — 8 runs x 2 calls against a 2000/day allowance — and
    # scripts/snapshot.ts leaves the file untouched when nothing has changed, so
    # quiet windows produce no commit and no redeploy.
    - cron: '50 */3 * * *'

  # Lets you trigger a snapshot by hand from the Actions tab.
  workflow_dispatch:

# The snapshot job pushes a commit, so it needs write access to the repo.
permissions:
  contents: write

# Never let two snapshot runs race — they'd both try to push to main.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      # Tells the deploy job below whether there's anything new to publish.
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must be 24 or newer. scripts/snapshot.ts is run directly as
          # TypeScript, and Node only strips types without a flag from 23.6
          # onwards — on Node 22 this step fails with a syntax error.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's stats
        env:
          # Set under Settings -> Secrets and variables -> Actions.
          RENSHUU_API_KEY: ${{ secrets.RENSHUU_API_KEY }}
          # Must match renshuu's daily reset boundary — see the cron note above.
          SNAPSHOT_TIMEZONE: Europe/Berlin
        run: npm run snapshot

      - name: Commit the updated archive
        id: commit
        run: |
          # Stop on any error, and treat an unset variable as an error.
          set -euo pipefail

          # `git diff --quiet` exits 0 when the file is byte-identical.
          #
          # This is the common path now, not an edge case: the script leaves the
          # file untouched when a run finds nothing new, so the several runs a
          # day that land in windows where you weren't studying produce no
          # commit and no redeploy.
          # The badges are regenerated from the archive on every run, so they
          # are part of the same commit — a badge that disagreed with the
          # dashboard would be worse than no badge.
          if git diff --quiet -- public/data/history.json public/badge-*.svg; then
            echo "No change to the archive today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The bot identity GitHub uses for Actions commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/history.json public/badge-light.svg public/badge-dark.svg
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Rebuild and republish the site so the new data is actually visible.
  #
  # This has to be an explicit call rather than relying on deploy.yml's own
  # `on: push` trigger. GitHub deliberately does not fire workflows for pushes
  # made with the built-in GITHUB_TOKEN — it's how they stop a workflow that
  # commits from triggering itself forever. Without this job the archive would
  # grow every day while the deployed dashboard silently stayed stale.
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    # A called workflow gets no permissions by default; they must be granted
    # here, and can only ever be narrower than this workflow's own.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
