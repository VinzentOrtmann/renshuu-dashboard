# Builds the Vite app and publishes it to GitHub Pages.
#
# This uses the "GitHub Actions" Pages source (not a gh-pages branch), so the
# built site never gets committed to the repo. Enable it once under:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  # Deploy whenever main changes. Note that the daily snapshot workflow commits
  # to data/history.json on main, which means a fresh snapshot automatically
  # triggers a redeploy with the new data baked in.
  push:
    branches: [main]
  # Allow deploying by hand from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If several deploys queue up, let the newest one win rather than running them
# all. `cancel-in-progress: false` lets an in-flight deploy finish cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs the exact versions from package-lock.json, which is
      # what you want in CI (unlike `npm install`, which may update the lock).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Kept as a separate job so the build can't accidentally publish a broken
    # artifact — deploy only starts if build succeeded.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
